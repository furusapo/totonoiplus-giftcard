<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOTONOI+｜ギフトチケット 有効期限確認</title>
<meta name="description" content="お手元のTOTONOI+ギフトチケットの有効期限を確認できます。">
<meta property="og:site_name" content="TOTONOI+">
<meta property="og:type" content="website">
<meta property="og:title" content="TOTONOI+｜ギフトチケット 有効期限確認">
<meta property="og:description" content="お手元のTOTONOI+ギフトチケットの有効期限を確認できます。">
<meta property="og:url" content="https://furusapo.github.io/totonoiplus-giftcard/giftcard-check.html">


  <style>
*{box-sizing:border-box}

:root{
  --green:#173d32;
  --green2:#245746;
  --gold:#b8955d;
  --gold2:#d5bd91;
  --cream:#f7f3eb;
  --paper:#fffdf9;
  --ink:#26302c;
  --muted:#756f66;
  --line:#e4d9c8;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(184,149,93,.10),transparent 34%),
    linear-gradient(145deg,#fbf9f5 0%,#efe8dc 100%);
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px 20px;
}

.customerCard{
  width:100%;
  max-width:500px;
  background:rgba(255,253,249,.97);
  border:1px solid rgba(184,149,93,.34);
  border-radius:30px;
  padding:34px 32px 30px;
  box-shadow:0 24px 70px rgba(69,53,33,.13);
  position:relative;
  overflow:hidden;
}

.customerCard::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:5px;
  background:linear-gradient(90deg,var(--green),var(--gold),var(--green));
}

.customerType{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
}

.customerBadge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:999px;
  color:var(--green);
  background:#eef4f0;
  border:1px solid #cddfd5;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}

.brand{
  text-align:center;
  color:var(--gold);
  font-family:Georgia,"Times New Roman",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.24em;
  margin-bottom:9px;
}

.eyebrow{
  text-align:center;
  color:#9a8769;
  font-size:10px;
  font-weight:700;
  letter-spacing:.22em;
  margin-bottom:8px;
}

h1{
  margin:0;
  text-align:center;
  color:var(--green);
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:28px;
  font-weight:600;
  line-height:1.5;
  letter-spacing:.05em;
}

.lead{
  margin:14px 0 28px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.9;
}

.inputArea{
  padding:22px;
  border-radius:22px;
  background:#f8f5ef;
  border:1px solid var(--line);
}

label{
  display:block;
  margin-bottom:9px;
  color:#514a41;
  font-size:13px;
  font-weight:800;
}

input{
  width:100%;
  padding:17px 15px;
  border:1px solid #d7cbb9;
  border-radius:14px;
  outline:none;
  background:#fff;
  color:#262626;
  font-size:19px;
  font-weight:700;
  letter-spacing:.10em;
  text-align:center;
  transition:.2s ease;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(184,149,93,.12);
}

button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:0 8px 20px rgba(23,61,50,.18);
  font-size:15px;
  font-weight:800;
  letter-spacing:.06em;
}

button:active{
  transform:translateY(1px);
}

.result{
  display:none;
  margin-top:22px;
  padding:20px;
  border-radius:20px;
  background:#fff;
  border:1px solid var(--line);
}

.result h2{
  margin:0 0 13px;
  color:var(--green);
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:11px 0;
  border-bottom:1px solid #eee6db;
}

.row:last-child{
  border-bottom:0;
}

.k{
  color:#847c70;
  font-size:13px;
}

.v{
  color:#302d29;
  font-weight:800;
  text-align:right;
}

.ok{
  color:#167a3a;
}

.used{
  color:#b3261e;
}

.note{
  margin:21px 0 0;
  color:#8b8378;
  text-align:center;
  font-size:11px;
  line-height:1.8;
}

@media(max-width:560px){
  .wrap{
    padding:18px 14px;
  }

  .customerCard{
    padding:28px 20px 24px;
    border-radius:24px;
  }

  h1{
    font-size:24px;
  }

  .inputArea{
    padding:18px;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="customerCard">

      <div class="customerType">
        <div class="customerBadge">
          CUSTOMER　｜　お客様用ページ
        </div>
      </div>

      <div class="brand">TOTONOI+</div>
      <div class="eyebrow">GIFT TICKET</div>

      <h1>
        ギフトチケット<br>
        有効期限確認
      </h1>

      <p class="lead">
        お手元のギフトチケットに記載されている<br>
        管理番号をご入力ください。
      </p>

      <div class="inputArea">
        <label for="serial">ギフトチケット管理番号</label>
        <input
          id="serial"
          placeholder="例：TG-00001"
          autocomplete="off"
        >
        <button onclick="checkSerial()">有効期限を確認する</button>
      </div>

      <div id="result" class="result"></div>

      <p class="note">
        管理番号が確認できない場合は、店舗スタッフまでお問い合わせください。
      </p>

    </div>
  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxrRcaJSBI8QN1KWBogbD0MK222FtVBDvlmSnRN2nsEaSwrOyv7xqxtosK_Yk6nHnx8/exec";

async function checkSerial(){
  const serial = document.getElementById("serial").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if(!serial){
    result.style.display="block";
    result.innerHTML="<h2>シリアル番号を入力してください</h2>";
    return;
  }

  result.style.display="block";
  result.innerHTML="<h2>確認中です...</h2>";

  try{
    const res = await fetch(GAS_URL + "?mode=check&serial=" + encodeURIComponent(serial));
    const data = await res.json();

    if(!data.found){
      result.innerHTML="<h2>該当するギフトカードが見つかりません</h2>";
      return;
    }

    const statusClass =
      data.status === "使用済" || data.status === "期限切れ" ? "used" : "ok";

    result.innerHTML = `
      <h2>確認結果</h2>
      <div class="row"><div class="k">シリアル番号</div><div class="v">${data.serial || serial}</div></div>
      <div class="row"><div class="k">有効期限</div><div class="v">${data.expiry || "-"}</div></div>
      <div class="row"><div class="k">状態</div><div class="v ${statusClass}">${data.status || "-"}</div></div>
      <div class="row"><div class="k">デザイン</div><div class="v">${data.design || "-"}</div></div>
    `;
  }catch(e){
    result.innerHTML="<h2>確認できませんでした</h2><p>時間をおいて再度お試しください。</p>";
  }
}
</script>
</body>
</html>
