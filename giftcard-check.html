<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOTONOI+｜お客様用 ギフトチケット有効期限確認</title>
<meta name="description" content="お客様用のTOTONOI+ギフトチケット有効期限確認ページです。">
<meta property="og:site_name" content="TOTONOI+">
<meta property="og:type" content="website">
<meta property="og:title" content="TOTONOI+｜お客様用 ギフトチケット有効期限確認">
<meta property="og:description" content="お客様用のTOTONOI+ギフトチケット有効期限確認ページです。">
<meta property="og:url" content="https://furusapo.github.io/totonoiplus-giftcard/giftcard-check.html">


  <style>
*{box-sizing:border-box}

:root{
  --black:#080808;
  --black2:#17130e;
  --black3:#221c14;
  --gold:#d4b47a;
  --gold2:#b58b4f;
  --cream:#f7f0e4;
  --muted:#c8bca8;
  --line:rgba(212,180,122,.32);
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Arial,sans-serif;
  color:var(--cream);
  background:
    radial-gradient(circle at 50% 0%,rgba(212,180,122,.10),transparent 35%),
    linear-gradient(145deg,#050505 0%,#17130e 100%);
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px 20px;
}

.customerCard{
  width:100%;
  max-width:500px;
  position:relative;
  overflow:hidden;
  padding:34px 32px 30px;
  border:1px solid var(--line);
  border-radius:30px;
  background:
    linear-gradient(145deg,#111 0%,#1b1712 100%);
  box-shadow:
    0 30px 90px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.02) inset;
}

.customerCard::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    #f1d7a7,
    var(--gold),
    transparent
  );
}

.customerType{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}

.customerBadge{
  display:inline-flex;
  align-items:center;
  padding:8px 17px;
  border:1px solid rgba(212,180,122,.45);
  border-radius:999px;
  background:rgba(212,180,122,.08);
  color:var(--gold);
  font-size:11px;
  font-weight:800;
  letter-spacing:.11em;
}

.brand{
  margin-bottom:10px;
  text-align:center;
  color:var(--gold);
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  font-weight:700;
  letter-spacing:.25em;
}

.eyebrow{
  margin-bottom:9px;
  text-align:center;
  color:#9e8b6b;
  font-size:10px;
  font-weight:700;
  letter-spacing:.24em;
}

h1{
  margin:0;
  color:#fffaf0;
  text-align:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:28px;
  font-weight:500;
  line-height:1.55;
  letter-spacing:.06em;
}

.lead{
  margin:15px 0 28px;
  color:var(--muted);
  text-align:center;
  font-size:14px;
  line-height:1.9;
}

.inputArea{
  padding:22px;
  border:1px solid rgba(212,180,122,.20);
  border-radius:20px;
  background:rgba(255,255,255,.035);
}

label{
  display:block;
  margin-bottom:9px;
  color:#d9cdbb;
  font-size:13px;
  font-weight:700;
}

input{
  width:100%;
  padding:17px 15px;
  border:1px solid rgba(212,180,122,.42);
  border-radius:13px;
  outline:none;
  background:#f9f6f0;
  color:#15120e;
  font-size:19px;
  font-weight:800;
  letter-spacing:.12em;
  text-align:center;
  transition:.2s ease;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(212,180,122,.12);
}

button{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:1px solid #e3c58f;
  border-radius:13px;
  cursor:pointer;
  background:linear-gradient(135deg,#d7ba83,#a97e42);
  color:#17110a;
  box-shadow:0 10px 26px rgba(181,139,79,.20);
  font-size:15px;
  font-weight:900;
  letter-spacing:.06em;
}

button:active{
  transform:translateY(1px);
}

.result{
  display:none;
  margin-top:22px;
  padding:20px;
  border:1px solid rgba(212,180,122,.28);
  border-radius:18px;
  background:#15120e;
}

.result h2{
  margin:0 0 13px;
  color:var(--gold);
  font-size:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:18px;
  padding:11px 0;
  border-bottom:1px solid rgba(212,180,122,.13);
}

.row:last-child{
  border-bottom:0;
}

.k{
  color:#a99d8b;
  font-size:13px;
}

.v{
  color:#fff8eb;
  font-weight:800;
  text-align:right;
}

.ok{
  color:#87d5a2;
}

.used{
  color:#ff998e;
}

.note{
  margin:21px 0 0;
  color:#8e8373;
  text-align:center;
  font-size:11px;
  line-height:1.8;
}

@media(max-width:560px){
  .wrap{
    padding:18px 14px;
  }

  .customerCard{
    padding:28px 20px 24px;
    border-radius:24px;
  }

  h1{
    font-size:24px;
  }

  .inputArea{
    padding:18px;
  }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="customerCard">

      <div class="customerType">
        <div class="customerBadge">
          FOR GUESTS　｜　お客様用
        </div>
      </div>

      <div class="brand">TOTONOI+</div>
      <div class="eyebrow">GIFT TICKET</div>

      <h1>
        ギフトチケット<br>
        有効期限確認
      </h1>

      <p class="lead">
        お手元のギフトチケットに記載されている<br>
        管理番号をご入力ください。
      </p>

      <div class="inputArea">
        <label for="serial">ギフトチケット管理番号</label>
        <input
          id="serial"
          placeholder="例：TG-00001"
          autocomplete="off"
        >
        <button onclick="checkSerial()">有効期限を確認する</button>
      </div>

      <div id="result" class="result"></div>

      <p class="note">
        管理番号が確認できない場合は、店舗スタッフまでお問い合わせください。
      </p>

    </div>
  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxrRcaJSBI8QN1KWBogbD0MK222FtVBDvlmSnRN2nsEaSwrOyv7xqxtosK_Yk6nHnx8/exec";

async function checkSerial(){
  const serial = document.getElementById("serial").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if(!serial){
    result.style.display="block";
    result.innerHTML="<h2>シリアル番号を入力してください</h2>";
    return;
  }

  result.style.display="block";
  result.innerHTML="<h2>確認中です...</h2>";

  try{
    const res = await fetch(GAS_URL + "?mode=check&serial=" + encodeURIComponent(serial));
    const data = await res.json();

    if(!data.found){
      result.innerHTML="<h2>該当するギフトチケットが見つかりません</h2>";
      return;
    }

    const statusClass =
      data.status === "使用済" || data.status === "期限切れ" ? "used" : "ok";

    result.innerHTML = `
      <h2>確認結果</h2>
      <div class="row"><div class="k">シリアル番号</div><div class="v">${data.serial || serial}</div></div>
      <div class="row"><div class="k">有効期限</div><div class="v">${data.expiry || "-"}</div></div>
      <div class="row"><div class="k">状態</div><div class="v ${statusClass}">${data.status || "-"}</div></div>
      <div class="row"><div class="k">デザイン</div><div class="v">${data.design || "-"}</div></div>
    `;
  }catch(e){
    result.innerHTML="<h2>確認できませんでした</h2><p>時間をおいて再度お試しください。</p>";
  }
}
</script>
</body>
</html>
