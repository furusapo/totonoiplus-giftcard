<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="大切な人に、ととのう時間を贈る。totonoi+ ギフトカード。">
  <title>totonoi+｜Gift Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#cfa447; --ink:#241e17; --paper:#fbf8f3; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Noto Serif JP", serif; }
    .hero { min-height:0; aspect-ratio:1262/790; padding:64px max(6.2vw,64px); color:#fff; position:relative; overflow:hidden; background:linear-gradient(90deg,rgba(15,10,6,.18) 0%,rgba(15,10,6,.03) 55%,transparent 100%),url('assets/giftcard-hero.png') center/cover; }
    .brand,.hero-content { position:relative; z-index:1; }.brand { font-family:"Cormorant Garamond", "Noto Serif JP", serif; font-size:30px; font-weight:600; letter-spacing:.19em; line-height:1; }.brand sup { font-family:inherit; font-size:16px; top:-.72em; position:relative; margin-left:1px; }
    .hero-content { margin-top:76px; }.hero h1 { font-weight:400; font-size:clamp(42px,5.25vw,56px); line-height:1.58; letter-spacing:.115em; margin:0; }.gold-rule { width:285px; aspect-ratio:5/1; margin:12px 0 58px 18px; background:url('assets/gold-rule.png') center/contain no-repeat; }
    .hero p { margin:0 0 0 12px; font-size:20px; line-height:1.95; letter-spacing:.075em; }
    .details { min-height:430px; padding:63px max(4vw,30px) 48px; background:url('assets/giftcard-paper.png') center/cover; }.details-top { max-width:940px; margin:0 auto 36px; display:grid; grid-template-columns:minmax(0,1fr) 170px; align-items:center; gap:32px; }.benefits { margin:0; display:grid; grid-template-columns:repeat(3,1fr); text-align:center; gap:25px; }.benefit { font-size:14px; line-height:2; letter-spacing:.1em; }.mini-rule { width:185px; aspect-ratio:5/1; margin:10px auto 0; background:url('assets/gold-rule.png') center/contain no-repeat; }
    .store-note { width:156px; aspect-ratio:1; display:block; justify-self:end; object-fit:contain; }
    .check-card { max-width:840px; min-height:160px; margin:0 auto; padding:28px; display:grid; place-items:center; color:#fff; border-radius:6px; background:linear-gradient(120deg,rgba(7,6,5,.22),rgba(23,16,10,.18)),url('assets/giftcard-black.png') center/cover; box-shadow:0 8px 18px rgba(67,43,24,.2); }.check-card p { margin:0 0 17px; letter-spacing:.12em; }.check-button { width:min(448px,80vw); padding:12px 20px; border:1px solid rgba(255,255,255,.86); border-radius:6px; color:#fff; background:rgba(0,0,0,.14); text-align:center; text-decoration:none; font-size:16px; letter-spacing:.12em; }.check-button small { display:block; margin-top:4px; font-size:10px; }
    .uses { display:grid; grid-template-columns:repeat(3,1fr); }.use { height:310px; display:grid; place-items:center; text-align:center; color:#fff; position:relative; isolation:isolate; background-position:center; background-size:cover; }.use::before { content:""; position:absolute; inset:0; z-index:-1; background:rgba(19,13,8,.36); }.use:nth-child(1){background-image:url('assets/sauna.png')}.use:nth-child(2){background-image:url('assets/coworking.png')}.use:nth-child(3){background-image:url('assets/drink.png')}.use h2 { font-weight:400; font-size:20px; letter-spacing:.16em; margin:0 0 9px; }.use p { margin:0; font-size:11px; line-height:1.8; letter-spacing:.08em; }
    @media (max-width:650px){.hero{min-height:560px;aspect-ratio:auto;padding:42px 28px}.brand{font-size:27px}.hero-content{margin-top:70px}.hero h1{font-size:36px;line-height:1.55}.gold-rule{margin:18px 0 54px;width:200px}.hero p{margin-left:0;font-size:15px}.details{padding:48px 22px 36px}.details-top{grid-template-columns:1fr;gap:32px;margin-bottom:36px}.benefits{gap:19px}.benefit{font-size:11px}.mini-rule{width:100%}.store-note{justify-self:center;width:150px}.check-card{padding:26px 14px;min-height:154px}.check-button{font-size:14px}.uses{grid-template-columns:1fr}.use{height:220px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand">totonoi<sup>+</sup></div>
    <div class="hero-content">
      <h1>大切な人に<br>ととのう時間を贈る</h1>
      <div class="gold-rule"></div>
      <p>サウナ・カフェ・コワーキングで使える<br>特別なギフトカードのご案内です。</p>
    </div>
  </header>
  <main>
    <section class="details">
      <div class="details-top">
        <div class="benefits">
          <div class="benefit">用途に合わせて<br>ギフトとして贈れます<div class="mini-rule"></div></div>
          <div class="benefit">有効期限内で<br>ご利用いただけます<div class="mini-rule"></div></div>
          <div class="benefit">TOTONOI+で<br>ご利用いただけます<div class="mini-rule"></div></div>
        </div>
        <img class="store-note" src="assets/store-note.png" alt="店頭でのご購入が基本です。ご希望の方には、ご来店不要での販売も承ります。">
      </div>
      <div class="check-card"><p>ギフトカードをお持ちの方</p><a class="check-button" href="https://furusapo.github.io/totonoiplus-giftcard/giftcard-check.html">有効期限を確認する<small>有効期限はこちらからご確認いただけます</small></a></div>
    </section>
    <section class="uses">
      <article class="use"><div><h2>サウナで</h2><p>心と身体をととのえ<br>自分らしくいられる時間を</p></div></article>
      <article class="use"><div><h2>コワーキングで</h2><p>集中できる環境で<br>仕事やアイデアを形にする時間を</p></div></article>
      <article class="use"><div><h2>ドリンクにも</h2><p>アルコールやカフェメニューなどにも<br>ご利用いただけます</p></div></article>
    </section>
  </main>
</body>
</html>
